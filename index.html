<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
#setup{height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:28px;background:radial-gradient(circle at 50% 35%,#172038 0,#080b13 43%,#030407 100%)}
h1{font-size:42px;margin:0;text-align:center;letter-spacing:.08em}.sub{text-align:center;opacity:.7;line-height:1.7}
input{width:100%;font-size:26px;padding:18px;border-radius:18px;border:1px solid #53617d;background:#0b101c;color:#fff;text-align:center}
button{font-size:24px;font-weight:800;padding:20px;border:0;border-radius:20px;background:#fff;color:#05070b}
#stage{position:fixed;inset:0;display:none;overflow:hidden;background:#000}
.takashiPic{position:absolute;z-index:8;border-radius:22px;object-fit:cover;
box-shadow:none;pointer-events:none;
animation:picPop 1.8s ease-in-out both}
@keyframes picPop{0%{transform:scale(.15) rotate(-14deg);opacity:0}45%{transform:scale(1.08) rotate(5deg);opacity:1}100%{transform:scale(.9) rotate(-3deg);opacity:.9}}
#takashiFinalPic{display:none}
#final>*:not(#takashiFinalPic){position:relative;z-index:2}
#final small{position:absolute!important;top:3vh;left:50%;transform:translateX(-50%);z-index:30}
#again{position:absolute!important;bottom:max(4vh,24px);left:50%;transform:translateX(-50%);z-index:40;display:block!important}
.finalFace{position:absolute;z-index:4;width:min(15vw,112px);height:auto;object-fit:contain;filter:none;
animation:faceIn .85s cubic-bezier(.15,.8,.2,1) both}
@keyframes faceIn{0%{transform:scale(.05) rotate(-25deg);opacity:0}75%{transform:scale(1.12) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.item{position:absolute;white-space:nowrap;font-weight:900;line-height:1;user-select:none;will-change:transform,opacity}
#status{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:13px;letter-spacing:.35em;opacity:.55;z-index:20}
#final{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#151515 0,#000 70%);z-index:30}
#final small{letter-spacing:.35em;opacity:.55;margin-bottom:22px}
#finalWord{position:absolute!important;left:50%;top:46%;transform:translate(-50%,-50%);z-index:10;font-weight:1000;text-align:center;line-height:.86;writing-mode:vertical-rl;text-orientation:upright;max-width:92vw;max-height:72vh;white-space:nowrap;overflow:visible;padding:0;transform-origin:center center}
#again{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));font-size:16px;padding:13px 22px;opacity:.85;white-space:nowrap}
.moneyIcon{font-size:1.15em}
.phallic{display:inline-flex;align-items:center;position:relative;width:1.75em;height:.82em;vertical-align:middle}
.phallic:before{content:"";position:absolute;left:.42em;top:.25em;width:1.02em;height:.34em;border-radius:.18em;background:currentColor}
.phallic:after{content:"";position:absolute;right:.08em;top:.18em;width:.46em;height:.48em;border-radius:50%;background:transparent;border:.12em solid currentColor}
.phallic i,.phallic b{position:absolute;left:.03em;top:.35em;width:.50em;height:.50em;border-radius:50%;background:currentColor}
.phallic b{left:.34em}
@keyframes pop{0%{transform:scale(.05) rotate(-20deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes zoom{0%{transform:translate(-50%,-50%) scale(.08);opacity:.15}70%{transform:translate(-50%,-50%) scale(1.12);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes flyL{0%{transform:translateX(-85vw) rotate(-25deg)}100%{transform:translateX(85vw) rotate(25deg)}}
@keyframes flyR{0%{transform:translateX(85vw) rotate(25deg)}100%{transform:translateX(-85vw) rotate(-25deg)}}
@keyframes fall{0%{transform:translateY(-130vh) rotate(0)}100%{transform:translateY(130vh) rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(.7)}50%{transform:scale(1.5)}}
.champagneOpen{position:absolute;inset:0;z-index:28;display:flex;align-items:center;justify-content:center;
font-weight:1000;text-align:center;white-space:nowrap;font-size:min(17vw,13vh);letter-spacing:.02em;
background:radial-gradient(circle,#332600 0,#120d00 45%,#000 78%);animation:champOpen 1.1s ease both}
@keyframes champOpen{0%{transform:scale(.35);opacity:0}65%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
.spark{position:fixed;width:10px;height:10px;border-radius:50%;z-index:25;pointer-events:none;box-shadow:0 0 12px currentColor;animation:sparkOut .8s ease-out forwards}
@keyframes sparkOut{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}

.finalFace{
 position:absolute;z-index:5;height:auto;object-fit:contain;
 filter:none;box-shadow:none;pointer-events:none;
}
#finalWord{z-index:30!important}
#again{z-index:60!important}


.radialBurst{position:absolute;left:50%;top:48%;z-index:18;pointer-events:none;
  transform:translate(-50%,-50%);font-weight:1000;white-space:nowrap;
  animation:radialBurstFly var(--dur) cubic-bezier(.12,.68,.22,1) forwards}
@keyframes radialBurstFly{
  0%{transform:translate(-50%,-50%) translate(0,0) scale(.08);opacity:0}
  12%{opacity:1}
  72%{opacity:1}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(var(--sc));opacity:0}
}
.seikeiJudge{position:absolute!important;left:50%!important;top:72%!important;transform:translate(-50%,-50%)!important;z-index:70!important;width:88px!important;height:88px!important;box-sizing:border-box!important;border:6px solid #fff!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;font-weight:1000;font-size:54px!important;line-height:1!important;color:#fff!important;background:rgba(0,0,0,.35)!important;text-shadow:0 2px 8px #000;pointer-events:none}

.barrage{position:absolute;z-index:17;pointer-events:none;font-weight:1000;white-space:nowrap;animation:barrageFly var(--dur) linear forwards}
@keyframes barrageFly{0%{transform:translateX(0) rotate(var(--rot));opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--travel)) rotate(var(--rot));opacity:0}}
.dropFx{position:absolute;z-index:17;pointer-events:none;font-weight:1000;white-space:nowrap;animation:dropFly var(--dur) cubic-bezier(.18,.65,.3,1) forwards}
@keyframes dropFly{0%{transform:translateY(-18vh) rotate(var(--rot)) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(115vh) rotate(calc(var(--rot) + 120deg)) scale(1.15);opacity:0}}
.sidePop{position:absolute;z-index:17;pointer-events:none;font-weight:1000;white-space:nowrap;animation:sidePopFly var(--dur) ease-out forwards}
@keyframes sidePopFly{0%{transform:translateX(var(--from)) scale(.35) rotate(var(--rot));opacity:0}20%{opacity:1}65%{transform:translateX(0) scale(1.15) rotate(0deg);opacity:1}100%{transform:translateX(var(--to)) scale(.8);opacity:0}}

#final.champagneFinal #finalWord{top:43%!important;max-height:66vh!important}
#final.champagneFinal #again{z-index:80!important}

.brandPict{
 position:absolute;z-index:18;font-weight:1000;letter-spacing:-.08em;
 color:#fff;text-shadow:0 2px 10px #000,0 0 16px currentColor;
 pointer-events:none;white-space:nowrap;
 animation:brandPictFly var(--dur,1700ms) ease-out both;
}
.brandPict small{font-size:.34em;letter-spacing:.08em;display:block;text-align:center;margin-top:-.18em}
@keyframes brandPictFly{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(var(--r,-10deg))}
 20%{opacity:1}
 100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px))) scale(var(--sc,2.1)) rotate(var(--r2,12deg))}
}
</style>

<body>
<section id="setup">
<h1>脳内スキャナー</h1>
<div class="sub">名前を入力して、スマートフォンを額に当ててください。</div>
<input id="name" placeholder="名前">
<button id="start">SCAN START</button>
</section>
<section id="stage">
<div id="status">NEURAL SCAN</div>
<div id="final"><img id="takashiFinalPic" alt=""><small>最深層欲求</small><div id="finalWord"></div><button id="again">もう一度</button></div>
</section>
<script>
// 主キーワード（旧・強キーワード）\nconst strong=["酒","チンポ","ちんこ","金","男","愛","ＬＯＶＥ","うどん","クスリ","裏引き","枕","整形","腹減った","ダルい","SEX","罰金"]; const normal=["休み","太客","素飲み"]; const mains=[...strong,...normal];
const subs=[...strong,...normal]; const smallSubs=["ヘアメ","黒服","並木通り","銀座8丁目"];
const hundredSet=new Set(strong); const champagneBrands=["ドンペリ","ヴーヴ","クリスタル","サロン","サロンマグナム","Ｐ２","Ｐ３","ピンドン","ラベイ","ベルエポック","グリュック","グラシャン"]; const bagTypes=["バーキン25","ケリー","カプシーヌ","ピコタン","マトラッセ","ココハンドル","ピーカブー","レディデオール","パズル","ハンモック","ボリード","ブックトート","ブリヨン"];
const sexPositions=["正常位","騎乗位","バック","立ちバック","座位","対面座位","背面座位","側位","寝バック","駅弁","松葉崩し","だいしゅきホールド","ロールスロイス"];
const bagBrand={
 "バーキン25":"HERMÈS","ケリー":"HERMÈS","ピコタン":"HERMÈS",
 "カプシーヌ":"LOUIS VUITTON",
 "マトラッセ":"CHANEL","ココハンドル":"CHANEL",
 "ピーカブー":"FENDI",
 "レディデオール":"DIOR",
 "パズル":"LOEWE","ハンモック":"LOEWE",
 "ボリード":"HERMÈS","ブックトート":"DIOR","ブリヨン":"DELVAUX"
};

const TAKASHI_MARI_IMG="TAKASHI_MARI_IMG.png";
const TAKASHI_CHIKAGE_IMG="TAKASHI_CHIKAGE_IMG.png";
const TAKASHI_SAKURA_IMG="TAKASHI_SAKURA_IMG.png";
const colors=["#ff3b30","#ffcc00","#34c759","#00d9ff","#0a84ff","#bf5af2","#ff2d55","#ffffff","#ff9f0a"];
const setup=document.getElementById("setup"),stage=document.getElementById("stage"),final=document.getElementById("final"),finalWord=document.getElementById("finalWord");
function normalizeName(s){
 let n=s.normalize("NFKC").trim();
 // Katakana -> Hiragana, preserving non-kana characters.
 n=n.replace(/[\u30A1-\u30F6]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
 return n;
}
function hash(s){let h=2166136261;for(const c of normalizeName(s)){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}
function mainFor(name){
 const raw=name.normalize("NFKC").trim();
 const n=normalizeName(name);
 if(raw.endsWith("❤️")||raw.endsWith("❤"))return "整形";
 if(raw==="ひかり"||raw==="ヒカリ")return "シャブ";
 if(raw==="高士")return "さくら";
 if(raw==="タカシ")return "千景";
 if(n==="たかし")return "まり";
 if(n==="まり")return "ちんこ";
 if(n==="まりあ")return "金";
 if(n==="みくも")return "ケーキ";
 return mains[hash(n)%mains.length];
}
function secondaryFor(name,main){let r=rng(hash(name)^0x9e3779b9);let a=subs.filter(x=>x!==main);return a[Math.floor(r()*a.length)]}
function pict(word){
 if(word==="金") return Math.random()<.38 ? "💴" : "金";
 if(word==="チンポ"||word==="ちんこ"){
   if(Math.random()<.42) return '<span class="phallic"><i></i><b></b></span>';
 }
 return word;
}


function heartsAt(x,y){
 for(let i=0;i<22;i++){
   const s=document.createElement("div");
   s.className="spark"; s.textContent="❤️";
   s.style.left=x+"px"; s.style.top=y+"px";
   const a=Math.random()*Math.PI*2, d=55+Math.random()*170;
   s.style.setProperty("--dx",Math.cos(a)*d+"px");
   s.style.setProperty("--dy",Math.sin(a)*d+"px");
   s.style.fontSize=(12+Math.random()*24)+"px";
   stage.appendChild(s); setTimeout(()=>s.remove(),900);
 }
}

function fireworksAt(x,y){
 const glyphs=["★","✦","●","◆","✧"];
 for(let i=0;i<24;i++){
   const s=document.createElement("div");
   s.className="spark";
   s.textContent=glyphs[Math.floor(Math.random()*glyphs.length)];
   s.style.color=colors[Math.floor(Math.random()*colors.length)];
   s.style.left=x+"px"; s.style.top=y+"px";
   const a=Math.random()*Math.PI*2, d=45+Math.random()*150;
   s.style.setProperty("--dx",Math.cos(a)*d+"px");
   s.style.setProperty("--dy",Math.sin(a)*d+"px");
   s.style.fontSize=(8+Math.random()*18)+"px";
   stage.appendChild(s); setTimeout(()=>s.remove(),900);
 }
}

function addItem(word,mode,delay,duration){
 const e=document.createElement("div");e.className="item";
 let shown=pict(word);
 if((word==="愛"||word==="ＬＯＶＥ") && Math.random()<.55){
   shown=(Math.random()<.5?"❤️ ":"")+shown+(Math.random()<.7?" ❤️":"");
 }
 e.innerHTML=shown;
 e.style.color=colors[Math.floor(Math.random()*colors.length)];
 e.style.fontSize=(24+Math.random()*58)+"px";
 e.style.left=(6+Math.random()*72)+"vw";e.style.top=(10+Math.random()*72)+"vh";
 let anim="pop"; if(mode===1)anim=Math.random()<.5?"flyL":"flyR"; if(mode===2)anim="fall"; if(mode===3)anim="pulse";
 e.style.animation=`${anim} ${duration}ms ${delay}ms both ${anim==="pulse"?"ease-in-out":"linear"}`;
 stage.appendChild(e); setTimeout(()=>e.remove(),delay+duration+200);
}

function runChampagneShow(name){
 // Phase 1 stays fixed: opening title.
 const opener=document.createElement("div");
 opener.className="champagneOpen";
 opener.textContent="シャンパン🥂";
 stage.appendChild(opener);
 setTimeout(()=>fireworksAt(innerWidth*.5,innerHeight*.5),650);
 setTimeout(()=>opener.remove(),2200);

 // Phase 2 now uses the same varied FX family as the normal scanner.
 // Pick a temporary champagne brand for each effect, so every run feels different.
 const brand=()=>champagneBrands[Math.floor(Math.random()*champagneBrands.length)];
 const fx=[
   ()=>barrageFx(brand(),2300+Math.random()*3400),
   ()=>rainFx(brand(),2300+Math.random()*3400),
   ()=>sideFx(brand(),2300+Math.random()*3400)
 ];
 fx.sort(()=>Math.random()-.5);
 const fxN=1+Math.floor(Math.random()*3);
 for(let i=0;i<fxN;i++) fx[i]();

 // Also keep the normal random text movement modes, but with varied brands.
 const modes=[0,1,2,3];
 const groups=3+Math.floor(Math.random()*4);
 for(let g=0;g<groups;g++){
   setTimeout(()=>{
     const n=4+Math.floor(Math.random()*7);
     for(let j=0;j<n;j++){
       const b=brand();
       addItem(b,modes[Math.floor(Math.random()*modes.length)],Math.random()*700,1300+Math.random()*1700);
     }
   },2400+g*(550+Math.random()*500));
 }

 // Radial is deliberately rare, matching the normal animation balance.
 if(Math.random()<.18) radialBurst(brand(),2800+Math.random()*3000);

 // Occasional fireworks at random positions, not a fixed end barrage.
 if(Math.random()<.55) setTimeout(()=>fireworksAt(innerWidth*(.2+Math.random()*.6),innerHeight*(.2+Math.random()*.55)),3300+Math.random()*2800);

 // Phase 3 stays fixed: one random brand as the giant vertical result.
 const chosen=brand();
 setTimeout(()=>{
   [...stage.querySelectorAll(".item,.spark,.barrage,.dropFx,.sidePop,.radialBurst,.brandPict")].forEach(x=>x.remove());
   final.style.display="flex"; final.classList.add("champagneFinal"); document.getElementById("again").style.display="block";
   finalWord.textContent=chosen;
   finalWord.style.color=colors[Math.floor(Math.random()*colors.length)];
   const nChars=[...chosen].length;
   const perChar=Math.max(12,Math.floor(66/nChars));
   finalWord.style.fontSize=`min(72vw, ${perChar}vh)`;
   finalWord.style.animation="zoom 1.05s cubic-bezier(.1,.8,.2,1) both";
   fireworksAt(innerWidth*.5,innerHeight*.42);
 },9000);
}


function brandPictogram(brand,delay=0){
 setTimeout(()=>{
   const e=document.createElement("div"); e.className="brandPict";
   e.textContent=brand;
   e.style.letterSpacing=".04em";
   e.style.fontWeight="900";
   e.style.left=(8+Math.random()*80)+"vw";
   e.style.top=(12+Math.random()*68)+"vh";
   e.style.fontSize=(24+Math.random()*34)+"px";
   e.style.color=colors[Math.floor(Math.random()*colors.length)];
   const a=Math.random()*Math.PI*2, dist=60+Math.random()*180;
   e.style.setProperty("--dx",Math.cos(a)*dist+"px");
   e.style.setProperty("--dy",Math.sin(a)*dist+"px");
   e.style.setProperty("--sc",(1.2+Math.random()*1.5).toFixed(2));
   e.style.setProperty("--r",(-18+Math.random()*36)+"deg");
   e.style.setProperty("--r2",(-18+Math.random()*36)+"deg");
   e.style.setProperty("--dur",(1200+Math.random()*1100)+"ms");
   stage.appendChild(e); setTimeout(()=>e.remove(),2600);
 },delay);
}

function finalTakashiFaces(imgSrc=TAKASHI_MARI_IMG){
 document.querySelectorAll(".finalFace").forEach(e=>e.remove());

 const addFace=(x,y,size,rot,opacity)=>{
   const im=document.createElement("img");
   im.className="finalFace";
   im.src=imgSrc;
   im.style.width=size+"vw";
   im.style.left=x+"vw";
   im.style.top=y+"vh";
   im.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;
   im.style.opacity=opacity;
   final.appendChild(im);
 };

 // 15 left-side positions, each mirrored exactly to the right.
 // This guarantees equal visual density on both halves.
 const rows=5, perRow=3;
 for(let r=0;r<rows;r++){
   for(let c=0;c<perRow;c++){
     const baseX=7 + c*14;             // centers: about 7,21,35
     const jitterX=(Math.random()-0.5)*5;
     const xL=baseX+jitterX;
     const xR=100-xL;                  // exact mirror
     const y=10 + r*16 + (Math.random()-0.5)*7;
     const size=10+Math.random()*5;
     const rot=-24+Math.random()*48;
     const opacity=(.84+Math.random()*.16).toFixed(2);

     addFace(xL,y,size,rot,opacity);
     addFace(xR,y,size,-rot,opacity);
   }
 }
}

function radialBurst(word,delay){
 setTimeout(()=>{
   const waves=3;
   for(let w=0;w<waves;w++){
     const n=7+w*6; // grows denser outward
     for(let i=0;i<n;i++){
       setTimeout(()=>{
         const e=document.createElement("div");
         e.className="radialBurst";
         let shown=word;
         if(word==="金"&&Math.random()<.32) shown="💴";
         e.textContent=shown;
         const a=(Math.PI*2*i/n)+(Math.random()-.5)*.28;
         const dist=(85+w*90)+Math.random()*95;
         e.style.setProperty("--dx",Math.cos(a)*dist+"px");
         e.style.setProperty("--dy",Math.sin(a)*dist+"px");
         e.style.setProperty("--sc",(1.8+Math.random()*1.4).toFixed(2));
         e.style.setProperty("--dur",(1050+Math.random()*650)+"ms");
         e.style.fontSize=(18+Math.random()*26)+"px";
         e.style.color=colors[Math.floor(Math.random()*colors.length)];
         stage.appendChild(e);
         setTimeout(()=>e.remove(),1900);
       },w*150+Math.random()*100);
     }
   }
 },delay);
}

function runShow(name){
 final.classList.remove("champagneFinal");
 const main=mainFor(name), secondary=secondaryFor(name,main);
 // Mixing ratio varies every scan. Special five words sometimes get a pure 100% run.
 const rawName=name.normalize("NFKC").trim(); const nn=normalizeName(name);
 const pure=(nn==="ひかり"||rawName==="高士"||rawName==="タカシ"||nn==="たかし"||nn==="まり"||nn==="まりあ"||nn==="みくも"||hundredSet.has(main));
 const mainRatio=pure?1:(.58+Math.random()*.32); // strong keywords are always 100% except explicit scatter rules
 const mode=Math.floor(Math.random()*4);
 const exactTakashi=rawName==="たかし";
 const exactKatakanaTakashi=rawName==="タカシ";
 const exactKanjiTakashi=rawName==="高士";
 const exactHikari=nn==="ひかり";
 if(exactTakashi){
   [500,1700,2900,4100,5400,6700].forEach(d=>addTakashiPic(d,TAKASHI_MARI_IMG));
 }
 if(exactKatakanaTakashi){
   [500,1700,2900,4100,5400,6700].forEach(d=>addTakashiPic(d,TAKASHI_CHIKAGE_IMG));
 }
 if(exactKanjiTakashi){
   [500,1700,2900,4100,5400,6700].forEach(d=>addTakashiPic(d,TAKASHI_SAKURA_IMG));
   [650,1200,1850,2450,3100,3800,4500,5200,5900,6600].forEach(d=>setTimeout(()=>{
     const e=document.createElement("div");
     e.className="item";
     e.textContent="ＬＯＶＥ❤️";
     e.style.left=(5+Math.random()*75)+"vw";
     e.style.top=(8+Math.random()*72)+"vh";
     e.style.fontSize=(22+Math.random()*30)+"px";
     e.style.transform=`rotate(${-25+Math.random()*50}deg)`;
     stage.appendChild(e);
     setTimeout(()=>e.remove(),2200);
   },d));
 }
 if(exactHikari){
   [450,950,1450,2000,2550,3150,3800,4450,5100,5750,6400,7000].forEach((d,i)=>setTimeout(()=>{
     const e=document.createElement("div");
     e.className="item";
     e.textContent=(i%2===0?"💉":"LOVE❤️");
     e.style.left=(4+Math.random()*82)+"vw";
     e.style.top=(7+Math.random()*74)+"vh";
     e.style.fontSize=(24+Math.random()*34)+"px";
     e.style.transform=`rotate(${-35+Math.random()*70}deg)`;
     stage.appendChild(e);
     setTimeout(()=>e.remove(),2100);
   },d));
 }
 // Radial burst is now only one of several possible accents, not the default.
 if(Math.random()<.18){
   const d=900+Math.random()*4300;
   let burstWord=main;
   if(exactHikari && Math.random()<.45) burstWord=Math.random()<.5?"💉":"LOVE❤️";
   if(main==="整形" && Math.random()<.35) burstWord=["目","鼻","顎","乳"][Math.floor(Math.random()*4)];
   if(main==="腹減った" && Math.random()<.35) burstWord=["寿司","焼肉","ステーキ","天ぷら","ラーメン"][Math.floor(Math.random()*4)];
   if((main==="裏引き"||main==="枕") && Math.random()<.22) burstWord=Math.random()<.5?"金ヅル":"色恋";
   radialBurst(burstWord,d);
 }
 const fxPool=[barrageFx,rainFx,sideFx];
 fxPool.sort(()=>Math.random()-.5);
 const fxN=1+Math.floor(Math.random()*3);
 for(let k=0;k<fxN;k++) fxPool[k](main,350+Math.random()*5400);
 const count=mode===1?52:38+Math.floor(Math.random()*18);
 for(let i=0;i<count;i++){
   let word;
   if(main==="整形" && Math.random()<.30){
     word=["目","鼻","顎","乳"][Math.floor(Math.random()*4)];
   } else if(main==="腹減った" && Math.random()<.30){
     word=["寿司","焼肉","ステーキ","天ぷら","ラーメン"][Math.floor(Math.random()*4)];
   } else if((main==="裏引き"||main==="枕") && Math.random()<.14){
     word=Math.random()<.5?"金ヅル":"色恋";
   } else if((nn!=="ひかり"&&rawName!=="高士"&&rawName!=="タカシ"&&nn!=="たかし"&&nn!=="まり"&&nn!=="まりあ"&&nn!=="みくも") && Math.random()<.12){
     word=smallSubs[Math.floor(Math.random()*smallSubs.length)];
   } else {
     word=Math.random()<mainRatio?main:secondary;
   }
   addItem(word,mode,Math.random()*5600,1800+Math.random()*3000);
 }
 // extra escalating center words
 const centerAccentCount=1+Math.floor(Math.random()*3);
 for(let i=0;i<centerAccentCount;i++){
   setTimeout(()=>{
     if(normalizeName(name)==="まり"){
       fireworksAt(innerWidth*(.28+Math.random()*.44),innerHeight*(.28+Math.random()*.40));
     }
     if(main==="愛"||main==="ＬＯＶＥ"){
       heartsAt(innerWidth*(.25+Math.random()*.5),innerHeight*(.25+Math.random()*.5));
     }
     const e=document.createElement("div");e.className="item";
     e.innerHTML=pict(main);e.style.color=colors[Math.floor(Math.random()*colors.length)];
     e.style.fontSize=(34+i*18)+"px";e.style.left="50%";e.style.top="50%";
     e.style.transform="translate(-50%,-50%)";e.style.animation="pop .45s both";stage.appendChild(e);
     setTimeout(()=>e.remove(),650);
   },5900+i*480);
 }
 setTimeout(()=>{
   [...stage.querySelectorAll(".item")].forEach(x=>x.remove());
   final.style.display="flex"; document.getElementById("again").style.display="block";
   const tfp=document.getElementById("takashiFinalPic");
   tfp.style.display="none";
   tfp.src="";
   document.querySelectorAll(".finalFace").forEach(e=>e.remove());
   if(exactTakashi) finalTakashiFaces(TAKASHI_MARI_IMG);
    if(exactKatakanaTakashi) finalTakashiFaces(TAKASHI_CHIKAGE_IMG);
    if(exactKanjiTakashi) finalTakashiFaces(TAKASHI_SAKURA_IMG);
   const udonFinal=(main==="うどん"?(Math.random()<.5?"木屋うどん":"うらら"):null);
   finalWord.textContent=(nn==="みくも"?"ケーキ嫌い":udonFinal||main);

   finalWord.style.color=colors[Math.floor(Math.random()*colors.length)];
   const finalText=(nn==="みくも"?"ケーキ嫌い":udonFinal||main);
   // Vertical result: size primarily from available height so the full phrase stays visible.
   const nChars=[...finalText].length;
   // Use nearly the entire portrait screen while keeping every character visible.
   finalWord.style.fontSize=exactKanjiTakashi ? "min(56vw,34vh)" : (exactTakashi||exactKatakanaTakashi) ? "min(70vw,42vh)" : `min(72vw, ${Math.max(12, Math.floor(82/nChars))}vh)`;
   finalWord.style.animation="zoom 1.05s cubic-bezier(.1,.8,.2,1) both";

   // 整形だけ、最終結果の下に「有 / 無」を50:50で必ず表示
   document.querySelectorAll(".seikeiJudge").forEach(e=>e.remove());
   if(main==="整形"){
     const judge=document.createElement("div");
     judge.className="seikeiJudge";
     judge.textContent=Math.random()<.5?"有":"無";
     final.appendChild(judge);
   }   if(normalizeName(name)==="まり"){
     setTimeout(()=>fireworksAt(innerWidth*.5,innerHeight*.47),250);
     setTimeout(()=>fireworksAt(innerWidth*.5,innerHeight*.47),600);
   }
   if(main==="愛"||main==="ＬＯＶＥ"){
     setTimeout(()=>heartsAt(innerWidth*.5,innerHeight*.47),180);
     setTimeout(()=>heartsAt(innerWidth*.5,innerHeight*.47),620);
   }
   if(navigator.vibrate) navigator.vibrate([80,50,120]);
 },9000);
}
document.getElementById("start").onclick=async()=>{
 const name=document.getElementById("name").value.trim()||"名無し";
 setup.style.display="none";stage.style.display="block";final.style.display="none";
 document.getElementById("takashiFinalPic").style.display="none"; document.querySelectorAll(".finalFace").forEach(e=>e.remove());
 try{if(stage.requestFullscreen)await stage.requestFullscreen()}catch(e){}
 if(navigator.vibrate)navigator.vibrate(50);
 // Exact typed special modes always win.
 const specialName=normalizeName(name);
 if(specialName==="しゃんぱん") runChampagneShow(name);
 else if(specialName==="ばっく") runBagShow(name);
 else if(specialName==="せっくす") runSexShow(name);
 else{
   // Independent special draws. Priority only matters if more than one hits together.
   const champagneHit=Math.random()<1/7;
   const bagHit=Math.random()<1/20;
   const sexHit=Math.random()<1/15;
   if(champagneHit) runChampagneShow(name);
   else if(bagHit) runBagShow(name);
   else if(sexHit) runSexShow(name);
   else runShow(name);
 }
};
document.getElementById("again").onclick=()=>{
 final.style.display="none";stage.style.display="none";setup.style.display="flex";
 try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
};
