#setup .launchShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.12) 58%,rgba(0,0,0,.60));}
#setup .launchUI{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;padding:10vh 7vw 3.5vh;box-sizing:border-box;text-align:center;}
#setup .ginzaOnly{font-family:serif;font-size:clamp(15px,4.5vw,23px);letter-spacing:.14em;color:#d8d8d8;text-shadow:0 2px 10px #000;}
#setup .scannerTitle{font-family:serif;font-weight:700;font-size:clamp(22px,6.8vw,36px);letter-spacing:.04em;margin-top:.6vh;color:#f2f2f2;text-shadow:0 2px 12px #000;}
#setup .ginnouLogo{font-family:serif;font-weight:900;font-size:clamp(74px,24vw,128px);line-height:1;margin-top:1.3vh;letter-spacing:-.07em;background:linear-gradient(180deg,#fff 0%,#969696 34%,#fafafa 61%,#6d6d6d 87%,#eee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px rgba(255,255,255,.40)) drop-shadow(0 4px 6px #000);}
#setup .ginnouRoman{font-family:Georgia,serif;font-size:clamp(11px,3.6vw,17px);letter-spacing:.42em;margin-top:.45vh;color:#ddd;text-shadow:0 2px 8px #000;}
#setup .inputWrap{width:min(82vw,520px);margin-top:auto;}
#setup #name{width:100%!important;box-sizing:border-box!important;background:rgba(0,0,0,.76)!important;color:#eee!important;border:1.5px solid #bdbdbd!important;border-radius:19px!important;padding:17px 20px!important;font-size:18px!important;text-align:center!important;box-shadow:inset 0 0 15px rgba(255,255,255,.04),0 0 12px rgba(0,0,0,.75)!important;}
#setup #name::placeholder{color:#a0a0a0;opacity:1;}
#setup #start{width:min(78vw,490px)!important;margin:2vh auto 3vh!important;padding:15px 24px!important;border-radius:999px!important;border:1.5px solid #c9c9c9!important;background:linear-gradient(180deg,#202020,#050505)!important;color:#f5f5f5!important;font-family:Georgia,serif!important;font-size:clamp(24px,7vw,35px)!important;letter-spacing:.20em!important;box-shadow:inset 0 0 16px rgba(255,255,255,.15),0 0 11px rgba(255,255,255,.12)!important;}
#setup #start span{float:right;font-family:Arial,sans-serif;font-size:1.25em;line-height:.8;letter-spacing:0;}

#setup .ginnouMark{position:relative;display:inline-flex;justify-content:center;align-items:center;margin-top:1.3vh;width:min(78vw,430px);}
#setup .ginnouMark .ginnouLogo{margin-top:0!important;position:relative;z-index:2;}

const colors=["#ff3b30","#ffcc00","#34c759","#00d9ff","#0a84ff","#bf5af2","#ff2d55","#ffffff","#ff9f0a"];
const setup=document.getElementById("setup"),stage=document.getElementById("stage"),final=document.getElementById("final"),finalWord=document.getElementById("finalWord");
function normalizeName(s){
 let n=s.normalize("NFKC").trim();
 // Katakana -> Hiragana, preserving non-kana characters.
 n=n.replace(/[\u30A1-\u30F6]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
 return n;
}
function hash(s){let h=2166136261;for(const c of normalizeName(s)){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}
function mainFor(name){
 const raw=name.normalize("NFKC").trim();
 const n=normalizeName(name);
 if(raw.endsWith("❤️")||raw.endsWith("❤"))return "整形";
 if(raw==="ひかり"||raw==="ヒカリ")return "シャブ";
 if(raw==="高士")return "さくら";
 if(n==="さくら")return "変動金利";
 if(raw==="タカシ")return "千景";
 if(n==="たかし")return "まり";
 if(n==="まり")return "ちんこ";
 if(n==="まりあ")return "金";
 if(n==="みくも")return "ケーキ";
 let resetGen=0;
 try{resetGen=parseInt(localStorage.getItem("nounaiResetGen")||"0",10)||0}catch(e){}
 return mains[hash(n+"#"+resetGen)%mains.length];
}
function secondaryFor(name,main){let r=rng(hash(name)^0x9e3779b9);let a=subs.filter(x=>x!==main);return a[Math.floor(r()*a.length)]}
function pict(word){
 if(word==="金") return Math.random()<.38 ? "💴" : "金";
 if(word==="チンポ"||word==="ちんこ"){
   if(Math.random()<.42) return '<span class="phallic"><i></i><b></b></span>';
 }
 return word;
}


function heartsAt(x,y){
 for(let i=0;i<22;i++){
   const s=document.createElement("div");
   s.className="spark"; s.textContent="❤️";
   s.style.left=x+"px"; s.style.top=y+"px";
   const a=Math.random()*Math.PI*2, d=55+Math.random()*170;
   s.style.setProperty("--dx",Math.cos(a)*d+"px");
   s.style.setProperty("--dy",Math.sin(a)*d+"px");
   s.style.fontSize=(12+Math.random()*24)+"px";
   stage.appendChild(s); setTimeout(()=>s.remove(),900);
 }
}

function fireworksAt(x,y){
 const glyphs=["★","✦","●","◆","✧"];
 for(let i=0;i<24;i++){
   const s=document.createElement("div");
   s.className="spark";
   s.textContent=glyphs[Math.floor(Math.random()*glyphs.length)];
   s.style.color=colors[Math.floor(Math.random()*colors.length)];
   s.style.left=x+"px"; s.style.top=y+"px";
   const a=Math.random()*Math.PI*2, d=45+Math.random()*150;
   s.style.setProperty("--dx",Math.cos(a)*d+"px");
   s.style.setProperty("--dy",Math.sin(a)*d+"px");
   s.style.fontSize=(8+Math.random()*18)+"px";
   stage.appendChild(s); setTimeout(()=>s.remove(),900);
 }
}

function addItem(word,mode,delay,duration){
 const e=document.createElement("div");e.className="item";
 let shown=pict(word);
 if((word==="愛"||word==="ＬＯＶＥ") && Math.random()<.55){
   shown=(Math.random()<.5?"❤️ ":"")+shown+(Math.random()<.7?" ❤️":"");
 }
 e.innerHTML=shown;
 e.style.color=colors[Math.floor(Math.random()*colors.length)];
 e.style.fontSize=(24+Math.random()*58)+"px";
 e.style.left=(6+Math.random()*72)+"vw";e.style.top=(10+Math.random()*72)+"vh";
 let anim="pop"; if(mode===1)anim=Math.random()<.5?"flyL":"flyR"; if(mode===2)anim="fall"; if(mode===3)anim="pulse";
 e.style.animation=`${anim} ${duration}ms ${delay}ms both ${anim==="pulse"?"ease-in-out":"linear"}`;
 stage.appendChild(e); setTimeout(()=>e.remove(),delay+duration+200);
}


function champJet(word,delay){
 setTimeout(()=>{
   const e=document.createElement("div");
   e.className="champJet";
   e.textContent=word;
   const x=38+Math.random()*24;
   const spread=(Math.random()-.5)*112;
   e.style.setProperty("--jx",x+"vw");
   e.style.setProperty("--jx2",(x+spread*.55)+"vw");
   e.style.setProperty("--jx3",(x+spread)+"vw");
   e.style.setProperty("--jy",(24+Math.random()*34)+"vh");
   e.style.setProperty("--jy2",(-12+Math.random()*28)+"vh");
   e.style.setProperty("--jr",(-8+Math.random()*16)+"deg");
   e.style.setProperty("--jr2",(-18+Math.random()*36)+"deg");
   e.style.setProperty("--jr3",(-30+Math.random()*60)+"deg");
   e.style.setProperty("--jd",(2.05+Math.random()*.75)+"s");
   e.style.setProperty("--jc",colors[Math.floor(Math.random()*colors.length)]);
   e.style.fontSize=(18+Math.random()*17)+"px";
   stage.appendChild(e);
   setTimeout(()=>e.remove(),3700);
 },delay);
}

function finalTakashiFaces(imgSrc=TAKASHI_MARI_IMG){
 document.querySelectorAll(".finalFace").forEach(e=>e.remove());

 const addFace=(x,y,size,rot,opacity)=>{
   const im=document.createElement("img");
   im.className="finalFace";
   if(imgSrc===TAKASHI_MARI_IMG) im.classList.add("mariFrame");
   im.src=imgSrc;
   im.style.width=size+"vw";
   im.style.left=x+"vw";
   im.style.top=y+"vh";
   im.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;
   im.style.opacity=opacity;
   final.appendChild(im);
 };

 // 15 left-side positions, each mirrored exactly to the right.
 // This guarantees equal visual density on both halves.
 const rows=5, perRow=3;
 for(let r=0;r<rows;r++){
   for(let c=0;c<perRow;c++){
     const baseX=7 + c*14;             // centers: about 7,21,35
     const jitterX=(Math.random()-0.5)*5;
     const xL=baseX+jitterX;
     const xR=100-xL;                  // exact mirror
     const y=10 + r*16 + (Math.random()-0.5)*7;
     const size=10+Math.random()*5;
     const rot=-24+Math.random()*48;
     const opacity=(.84+Math.random()*.16).toFixed(2);

     addFace(xL,y,size,rot,opacity);
     addFace(xR,y,size,-rot,opacity);
   }
 }
}

function radialBurst(word,delay){
 setTimeout(()=>{
   const waves=3;
   for(let w=0;w<waves;w++){
     const n=7+w*6; // grows denser outward
     for(let i=0;i<n;i++){
       setTimeout(()=>{
         const e=document.createElement("div");
         e.className="radialBurst";
         let shown=(typeof word==="function"?word():word);
         if(shown==="金"&&Math.random()<.32) shown="💴";
         e.textContent=shown;
         const a=(Math.PI*2*i/n)+(Math.random()-.5)*.28;
         const dist=(85+w*90)+Math.random()*95;
         e.style.setProperty("--dx",Math.cos(a)*dist+"px");
         e.style.setProperty("--dy",Math.sin(a)*dist+"px");
         e.style.setProperty("--sc",(1.8+Math.random()*1.4).toFixed(2));
         e.style.setProperty("--dur",(1050+Math.random()*650)+"ms");
         e.style.fontSize=(18+Math.random()*26)+"px";
         e.style.color=colors[Math.floor(Math.random()*colors.length)];
         stage.appendChild(e);
         setTimeout(()=>e.remove(),1900);
       },w*150+Math.random()*100);
     }
   }
 },delay);
}

 if(specialName==="さくら") runShow(name);

 else if(specialName==="ばっく") runBagShow(name);
